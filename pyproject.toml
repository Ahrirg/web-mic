[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phone-mic-router"
version = "1.0.0"
description = "Use Android phones and other browsers as microphones on Linux via a PipeWire/PulseAudio virtual source"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PySide6>=6.5", "aiohttp>=3.9", "numpy>=1.24", "cryptography>=41", "segno>=1.5"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23"]

[project.scripts]
phone-mic-router = "app.main:main"

[tool.setuptools]
packages = ["app", "app.adb", "app.audio", "app.audio.backends", "app.config", "app.devices", "app.gui", "app.server"]
include-package-data = true

[tool.setuptools.package-data]
app = ["web/*"]
"app.gui" = ["style.qss"]
